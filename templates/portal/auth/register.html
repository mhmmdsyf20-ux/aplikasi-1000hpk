{% extends "portal/base.html" %} {% block title %}Daftar Akun{% endblock %} {%
block extra_head %}
<style>
  .register-wrapper {
    min-height: calc(100vh - 56px - 56px);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem 1rem;
  }
  .register-card {
    max-width: 480px;
    width: 100%;
    border-radius: 1.25rem;
    border: 1px solid rgba(255,255,255,0.25) !important;
    background: rgba(255,255,255,0.15) !important;
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    box-shadow: 0 25px 60px rgba(0,0,0,0.2);
  }
  .register-icon {
    width: 64px;
    height: 64px;
    background: linear-gradient(135deg, #ec4899, #f472b6);
    border-radius: 50%;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }
  .register-card h5, .register-card label, .register-card p,
  .register-card .form-label, .register-card .card-body {
    color: #fff !important;
  }
  .register-card .text-muted { color: rgba(255,255,255,0.7) !important; }
  .register-card .form-control,
  .register-card .form-select {
    background-color: rgba(255,255,255,0.15) !important;
    border-color: rgba(255,255,255,0.3) !important;
    color: #fff !important;
  }
  .register-card .form-control::placeholder { color: rgba(255,255,255,0.5) !important; }
  .register-card .form-control:focus,
  .register-card .form-select:focus {
    background-color: rgba(255,255,255,0.25) !important;
    border-color: rgba(255,255,255,0.6) !important;
    color: #fff !important;
    box-shadow: 0 0 0 0.2rem rgba(255,255,255,0.15) !important;
  }
  .register-card .input-group-text {
    background-color: rgba(255,255,255,0.15) !important;
    border-color: rgba(255,255,255,0.3) !important;
    color: rgba(255,255,255,0.85) !important;
  }
  .register-card .form-text { color: rgba(255,255,255,0.65) !important; }
  .register-card a { color: rgba(255,255,255,0.9) !important; }
  .register-card a:hover { color: #fff !important; }
  .register-card .btn-primary {
    background: linear-gradient(135deg, #ec4899, #f43f5e) !important;
    border: none !important;
    color: #fff !important;
    font-weight: 700;
  }
</style>
{% endblock %} {% block content %}
<div class="register-wrapper">
  <div class="register-card card shadow mx-auto">
    <div class="card-body p-4 p-sm-5">
      <!-- Ikon & Judul -->
      <div class="text-center mb-4">
        <div class="register-icon mb-3">
          <i class="bi bi-person-plus-fill fs-2 text-danger"></i>
        </div>
        <h5 class="fw-bold mb-1">Buat Akun Baru</h5>
        <p class="text-muted small mb-0">
          Daftar untuk memantau jadwal imunisasi anak Anda
        </p>
      </div>

      <!-- Form Registrasi -->
      <form
        method="POST"
        action="{{ url_for('portal.portal_register') }}"
        novalidate
      >
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />

        <!-- Nama Lengkap -->
        <div class="mb-3">
          <label for="nama_lengkap" class="form-label fw-semibold"
            >Nama Lengkap</label
          >
          <div class="input-group">
            <span class="input-group-text">
              <i class="bi bi-person"></i>
            </span>
            <input
              type="text"
              id="nama_lengkap"
              name="nama_lengkap"
              class="form-control"
              placeholder="Masukkan nama lengkap"
              required
              autofocus
              autocomplete="name"
              value="{{ request.form.get('nama_lengkap', '') }}"
            />
          </div>
        </div>

        <!-- Email -->
        <div class="mb-3">
          <label for="email" class="form-label fw-semibold">Email</label>
          <div class="input-group">
            <span class="input-group-text">
              <i class="bi bi-envelope"></i>
            </span>
            <input
              type="email"
              id="email"
              name="email"
              class="form-control"
              placeholder="contoh@email.com"
              required
              autocomplete="email"
              value="{{ request.form.get('email', '') }}"
            />
          </div>
        </div>

        <!-- Nomor WhatsApp (opsional) -->
        <div class="mb-3">
          <label for="no_whatsapp" class="form-label fw-semibold"
            >Nomor WhatsApp
            <span class="text-muted fw-normal">(opsional)</span></label
          >
          <div class="input-group">
            <span class="input-group-text">
              <i class="bi bi-whatsapp"></i>
            </span>
            <input
              type="tel"
              id="no_whatsapp"
              name="no_whatsapp"
              class="form-control"
              placeholder="08xxx atau +62xxx"
              autocomplete="tel"
              value="{{ request.form.get('no_whatsapp', '') }}"
            />
          </div>
          <div class="form-text text-muted">
            <i class="bi bi-info-circle me-1"></i>Format: 08xxx atau +62xxx
          </div>
        </div>

        <!-- Password -->
        <div class="mb-3">
          <label for="password" class="form-label fw-semibold">Password</label>
          <div class="input-group">
            <span class="input-group-text">
              <i class="bi bi-lock"></i>
            </span>
            <input
              type="password"
              id="password"
              name="password"
              class="form-control"
              placeholder="Buat password"
              required
              minlength="8"
              autocomplete="new-password"
            />
          </div>
          <div class="form-text text-muted">
            <i class="bi bi-shield-check me-1"></i>Minimal 8 karakter
          </div>
        </div>

        <!-- Konfirmasi Password -->
        <div class="mb-4">
          <label for="konfirmasi" class="form-label fw-semibold"
            >Konfirmasi Password</label
          >
          <div class="input-group">
            <span class="input-group-text">
              <i class="bi bi-lock-fill"></i>
            </span>
            <input
              type="password"
              id="konfirmasi"
              name="konfirmasi"
              class="form-control"
              placeholder="Ulangi password"
              required
              autocomplete="new-password"
            />
          </div>
        </div>

        <!-- Tombol Daftar -->
        <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">
          <i class="bi bi-person-check me-2"></i>Daftar
        </button>
      </form>

      <!-- Link Login -->
      <p class="text-center text-muted small mt-4 mb-0">
        Sudah punya akun?
        <a
          href="{{ url_for('portal.portal_login') }}"
          class="text-decoration-none fw-semibold"
        >
          Masuk di sini
        </a>
      </p>
    </div>
  </div>
</div>
{% endblock %}
