services:
  - type: web
    name: aplikasi-1000hpk
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --timeout 120 --workers 1 "app:create_app()"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: db-1000hpk
          property: connectionString
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NAMA
        value: Administrator
      - key: NAMA_FASILITAS
        value: Puskesmas

databases:
  - name: db-1000hpk
    databaseName: hpk1000
    user: hpk1000
